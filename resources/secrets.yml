# Secret scope used by the App's `valueFrom:` env bindings.
#
# Bundle creates the scope; the postdeploy job seeds the secret VALUES from
# the bundle variables (DAB doesn't have a first-class "secret value"
# resource type — values must be put via the secrets API, which the
# postdeploy notebook does).

resources:
  secret_scopes:
    doc_translation_secret_scope:
      name: ${var.secret_scope}
