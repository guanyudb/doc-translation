# Databricks App definition + resource bindings.
#
# Resource bindings auto-create env vars for the App service principal:
#   * postgres binding → PGHOST, PGDATABASE, PGUSER, PGPORT, PGSSLMODE
#   * sql_warehouse binding → DATABRICKS_WAREHOUSE_ID (when also declared with
#     valueFrom in app.yaml — per deploy-guide gotcha #1).
#
# NOTE on the postgres binding:
# Lakebase Project uses `postgres:` (new); legacy Provisioned uses `database:`.
# This bundle uses `postgres:` and assumes the customer is on a Lakebase
# Project. If they're on a legacy Provisioned instance, comment out the
# `postgres:` block and uncomment `database:` below.

resources:
  apps:
    doc_translation_app:
      name:        ${var.app_name}
      description: Compliance-grade reviewer + auto-translation pipeline for clinical DOCX
      source_code_path: ${workspace.file_path}

      resources:
        # ---- Lakebase Project (preferred) -----------------------------------
        # Commented out: e2-demo-field-eng has no Lakebase Projects, only
        # provisioned instances. Using the `database:` binding below instead.
        # - name: postgres
        #   postgres:
        #     branch:     projects/${var.lakebase_project}/branches/${var.lakebase_branch}
        #     database:   projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_slug}
        #     permission: CAN_CONNECT_AND_CREATE

        # ---- Lakebase Provisioned (legacy) ----------------------------------
        # DO NOT bind a provisioned instance here, and DON'T bind it from
        # postdeploy either. Adding a classic `database:` resource to an app is
        # gated behind workspace-admin authority the deploying user usually
        # lacks: both the Terraform-at-create path AND `w.apps.update` fail with
        # "User does not have permission to grant permissions for added resource:
        # postgres" — even when that user OWNS the instance + Postgres database
        # and has CAN_MANAGE, and even when the app SP already holds the exact
        # grants the binding would apply (verified empirically 2026-08-23).
        #
        # Instead the bundle creates the app WITHOUT a Postgres binding, and
        # `setup/postdeploy.py` reproduces everything the binding would do using
        # operations the deploying user CAN perform: (a) register the app SP as a
        # Postgres role, (b) grant the SP CAN_USE on the instance so it can mint
        # runtime DB credentials, and (c) GRANT CONNECT + schema/table privileges
        # to the SP via SQL. The app derives PGHOST (instance read/write DNS) and
        # PGUSER (DATABRICKS_CLIENT_ID) at runtime — see `server/config.py`.
        # Re-runs after every `bundle deploy` (like the file-arrival trigger).
        # - name: postgres
        #   database:
        #     instance_name: ${var.lakebase_instance}
        #     database_name: databricks_postgres
        #     permission:    CAN_CONNECT_AND_CREATE

        # ---- SQL warehouse for Delta sync -----------------------------------
        - name: warehouse
          sql_warehouse:
            id:         ${var.warehouse_id}
            permission: CAN_USE

        # ---- Secret-backed env vars ------------------------------------------
        # DAB doesn't substitute ${var.X} inside user files like app.yaml, so
        # workspace-specific config has to come through this binding pathway.
        # The secret SCOPE itself is created by `deploy.sh` step 1 (not by
        # the bundle — Terraform's databricks_secret_scope resource isn't
        # idempotent and conflicts on re-deploys when the scope already
        # exists). The secret VALUES are seeded by `deploy.sh` step 1 from
        # the values in `.databricks/bundle/<target>/variable-overrides.json`.
        - name: pg_schema
          secret:
            scope:      ${var.secret_scope}
            key:        pg_schema
            permission: READ
        - name: lakebase_project
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_project
            permission: READ
        - name: lakebase_branch
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_branch
            permission: READ
        - name: lakebase_instance
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_instance
            permission: READ
        - name: volume_root
          secret:
            scope:      ${var.secret_scope}
            key:        volume_root
            permission: READ
        - name: delta_catalog
          secret:
            scope:      ${var.secret_scope}
            key:        delta_catalog
            permission: READ
        - name: delta_schema
          secret:
            scope:      ${var.secret_scope}
            key:        delta_schema
            permission: READ
        # ---- Deploy-time branding (optional; blank → default icon + title) ---
        - name: app_title
          secret:
            scope:      ${var.secret_scope}
            key:        app_title
            permission: READ
        - name: app_logo_url
          secret:
            scope:      ${var.secret_scope}
            key:        app_logo_url
            permission: READ
        - name: app_logo_alt
          secret:
            scope:      ${var.secret_scope}
            key:        app_logo_alt
            permission: READ
