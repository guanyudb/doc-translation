# Databricks App definition + resource bindings.
#
# Resource bindings auto-create env vars for the App service principal:
#   * postgres binding → PGHOST, PGDATABASE, PGUSER, PGPORT, PGSSLMODE
#   * sql_warehouse binding → DATABRICKS_WAREHOUSE_ID (when also declared with
#     valueFrom in app.yaml — per deploy-guide gotcha #1).
#
# NOTE on the postgres binding:
# Lakebase Project uses `postgres:` (new); legacy Provisioned uses `database:`.
# This bundle uses `postgres:` and assumes the customer is on a Lakebase
# Project. If they're on a legacy Provisioned instance, comment out the
# `postgres:` block and uncomment `database:` below.

resources:
  apps:
    doc_translation_app:
      name:        ${var.app_name}
      description: Compliance-grade reviewer + auto-translation pipeline for clinical DOCX
      source_code_path: ${workspace.file_path}

      resources:
        # ---- Lakebase Project (preferred — this template's default) ---------
        # This binding does two essential things in Project mode: it registers
        # the app SP as a Postgres ROLE (so postdeploy's GRANTs can target it —
        # without this they fail with `role "<sp>" does not exist`), and it
        # injects PGHOST/PGUSER/PGPORT/PGDATABASE/PGSSLMODE into the app.
        # Required for Project deployments (e.g. the `vlm` project on
        # e2-demo-field-eng). Keep it ACTIVE unless you're on a legacy
        # Provisioned instance (see below).
        - name: postgres
          postgres:
            branch:     projects/${var.lakebase_project}/branches/${var.lakebase_branch}
            database:   projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_slug}
            permission: CAN_CONNECT_AND_CREATE

        # ---- Lakebase Provisioned (legacy) ----------------------------------
        # If you're on a legacy PROVISIONED instance (not a Project): comment
        # out the `postgres:` block above and set `lakebase_instance` in your
        # overrides. Do NOT add a classic `database:` binding here — for a
        # non-workspace-admin deployer both the Terraform-at-create path and
        # `w.apps.update` fail with "User does not have permission to grant
        # permissions for added resource: postgres" even when the user owns the
        # instance (verified 2026-08-23). Instead, `setup/postdeploy.py`
        # reproduces what the binding would do (guarded by `if lakebase_instance:`):
        # registers the app SP as a Postgres role, grants it CAN_USE on the
        # instance, and GRANTs schema/table privileges; the app derives PGHOST +
        # PGUSER at runtime (see server/config.py).

        # ---- SQL warehouse for Delta sync -----------------------------------
        - name: warehouse
          sql_warehouse:
            id:         ${var.warehouse_id}
            permission: CAN_USE

        # ---- Secret-backed env vars ------------------------------------------
        # DAB doesn't substitute ${var.X} inside user files like app.yaml, so
        # workspace-specific config has to come through this binding pathway.
        # The secret SCOPE itself is created by `deploy.sh` step 1 (not by
        # the bundle — Terraform's databricks_secret_scope resource isn't
        # idempotent and conflicts on re-deploys when the scope already
        # exists). The secret VALUES are seeded by `deploy.sh` step 1 from
        # the values in `.databricks/bundle/<target>/variable-overrides.json`.
        - name: pg_schema
          secret:
            scope:      ${var.secret_scope}
            key:        pg_schema
            permission: READ
        - name: lakebase_project
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_project
            permission: READ
        - name: lakebase_branch
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_branch
            permission: READ
        - name: lakebase_instance
          secret:
            scope:      ${var.secret_scope}
            key:        lakebase_instance
            permission: READ
        - name: volume_root
          secret:
            scope:      ${var.secret_scope}
            key:        volume_root
            permission: READ
        - name: delta_catalog
          secret:
            scope:      ${var.secret_scope}
            key:        delta_catalog
            permission: READ
        - name: delta_schema
          secret:
            scope:      ${var.secret_scope}
            key:        delta_schema
            permission: READ
        # ---- Deploy-time branding (optional; blank → default icon + title) ---
        - name: app_title
          secret:
            scope:      ${var.secret_scope}
            key:        app_title
            permission: READ
        - name: app_logo_url
          secret:
            scope:      ${var.secret_scope}
            key:        app_logo_url
            permission: READ
        - name: app_logo_alt
          secret:
            scope:      ${var.secret_scope}
            key:        app_logo_alt
            permission: READ
