# Databricks Asset Bundle — Doc Translation Review Platform
#
# Deploys: a FastAPI + React Databricks App (React SPA prebuilt into static/
# by ./build.sh, served by server_api.py) + a Lakebase-bound review database +
# a UC Volume for files + a postdeploy job that runs schema migrations and
# GRANTs the App service principal what it needs.
#
# Targets are workspace-portable; per-workspace values live in
# `.databricks/bundle/<target>/variable-overrides.json` (gitignored).
#
# We intentionally DO NOT use `mode: development` — that silently prefixes
# schema + volume names which contradicts customer expectations
# (see the deploy guide gotcha #6).
bundle:
  name: doc-translation

include:
  - variables.yml
  - resources/*.yml
  - resources/**/*.yml

sync:
  paths: [.]
  exclude:
    - .venv
    - "**/__pycache__"
    - .git
    - .claude
    - .databricks
    - DATABRICKS_COMPONENTS.html
    - "DATABRICKS_COMPONENTS_files/**"
    # The React app is shipped PREBUILT as static/ (see build.sh). The source
    # tree and its node_modules must never be synced — the Apps runtime has no
    # Node, and node_modules is huge.
    - "frontend/node_modules/**"
    - "frontend/**"
    # Legacy Streamlit app is kept in-repo for reference/rollback but isn't
    # part of the deployed FastAPI app.
    - "legacy/**"
    - demo_docs
    - "demo_docs/**"

targets:
  # Default target — customer fills in variable-overrides.json with their values.
  # NOTE: workspace.host can't reference ${var.X} (auth resolves before var
  # substitution). Use `--profile <name>` on the deploy command, or set
  # DATABRICKS_HOST in the environment.
  prod:
    default: true
    presets:
      name_prefix: ""

  # Isolated try-app for the PDF workflow (pdf-translation-workflow branch).
  # Fully walled off from `prod` via distinct app/schema/volume/pg_schema/secret
  # scope in .databricks/bundle/pdftry/variable-overrides.json — deploy with
  # `./deploy.sh pdftry --profile <p>`. Not for customer use.
  pdftry:
    presets:
      name_prefix: ""
